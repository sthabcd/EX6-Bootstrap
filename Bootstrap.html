

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spirited Away</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-2">
       
        <h1 class="text-center mb-2 text-primary">Spirited Away</h1>
        
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                
                <div class="text-center mb-2">
                    <img src="spirited-away-poster.webp" 
                         alt="Spirited Away Poster" 
                         class="img-fluid rounded">
                </div>

              
                <div class="text-center mb-2">
                    <p id="content">
                        Spirited Away tells the story of Chihiro, a young girl who finds herself trapped in a mysterious and magical world of spirits.
                    </p>
                </div>

                
                <div class="d-flex justify-content-center gap-1 mb-2">
                    <button class="btn btn-primary" onclick="showContent('Spirited Away tells the story of Chihiro, a young girl who finds herself trapped in a mysterious and magical world of spirits.')">Description</button>
                    <button class="btn btn-success" onclick="showContent('Main Cast:Rumi Hiiragi as Chihiro OginoMiyu\n Irino as HakuMari Natsuki as Yubaba/ZenibaBuna Sugawara as Kamaji')">Cast</button>
                    <button class="btn btn-warning" onclick="showContent('This is the only non-English film to win an Oscar for best animated feature. The film had no script; Hayao Miyazaki writing the story as he was drawing the storyboards! Spirited Away beat Titanics box office record in Japan when it was released')">Trivia</button>
                </div>
            </div>
        </div>
    </div>

   
    <script>
      
        function showContent(text) {
            document.getElementById('content').innerHTML = text;
        }
    </script>
</body>
</html>
